<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Plans</title>
<style>
/* Layout: plan-sheet list; a card opens a full-window viewer (plan left, walkable panorama right). */
:root{
  --bg:#f3f5f6; --sheet:#ffffff; --fg:#1d2629; --muted:#5d6b70; --line:#d5dcdf;
  --accent:#1f6f8b; --ok:#2f7d4f; --warn:#b4641c; --chip:#e6ecee; --plan:#1f6f8b; --cv:#8a4fb8; --bad:#c0392b; --dir:#d9822b; --gt:#b9c3c6;
  --font-body:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
  --font-data:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181a; --sheet:#1a2225; --fg:#e3eaec; --muted:#93a3a8; --line:#2c3a3e;
  --accent:#6fb8d2; --ok:#6cc08d; --warn:#e3a066; --chip:#24302f; --plan:#6fb8d2; --cv:#c39be6; --bad:#ef7b6c; --dir:#f0a050; --gt:#3a474b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181a; --sheet:#1a2225; --fg:#e3eaec; --muted:#93a3a8; --line:#2c3a3e;
  --accent:#6fb8d2; --ok:#6cc08d; --warn:#e3a066; --chip:#24302f; --plan:#6fb8d2; --cv:#c39be6; --bad:#ef7b6c; --dir:#f0a050; --gt:#3a474b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.page{max-width:1180px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
h1{font-size:1.6rem;font-weight:600;margin:0}
.lede{color:var(--muted);margin:0;max-width:75ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--sheet);color:var(--fg);border-radius:999px;padding:4px 12px;cursor:pointer}
.btn{border-radius:8px;padding:6px 12px}
.chip[aria-pressed="true"],.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--sheet);color:var(--fg);border-radius:6px;padding:5px 10px;min-width:0}
#q{flex:1 1 200px}
.count{font-family:var(--font-data);font-size:.85rem;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;display:grid;grid-template-rows:auto auto 1fr;min-width:0;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{border-color:var(--accent)}
.head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;padding:10px 12px 4px}
.gid{font-family:var(--font-data);font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.tag{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}
.meta{padding:0 12px 8px;font-size:.8rem;color:var(--muted)}
.thumb{background:#fff;display:flex;align-items:center;justify-content:center;padding:4px}
.thumb img{max-width:100%;height:auto;display:block}
/* viewer */
#viewer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
.vhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3}
.vhead h2{margin:0;font-size:1.05rem;font-family:var(--font-data);overflow-wrap:anywhere}
.vgrid{display:grid;grid-template-columns:minmax(300px,.9fr) 1.4fr;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:860px){.vgrid{grid-template-columns:1fr}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.panel h3{margin:0 0 6px;font-size:.95rem}
#plan{width:100%;height:560px;display:block;background:var(--bg);border-radius:8px;touch-action:none}
.info{font-size:.84rem;color:var(--muted);margin:8px 0 0;line-height:1.6}
.info .warn{color:var(--warn)}.info .bad{color:var(--bad)}
.panowrap{position:relative;width:100%;height:560px;border-radius:8px;overflow:hidden;background:#cfd8da}
#pano{width:100%;height:100%;display:block;cursor:grab}#pano.drag{cursor:grabbing}
#overlay,#markers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:none;border-radius:50%;width:40px;height:40px;padding:0;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.35);font:700 13px var(--font-body);color:#173d48;cursor:pointer}
.mk.unc{color:#b4641c}.mk.bad{box-shadow:0 0 0 3px var(--bad),0 2px 8px rgba(0,0,0,.35)}.mk.wall{opacity:.45}.mk:hover{transform:translate(-50%,-50%) scale(1.1)}
.mk small{position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:500;background:rgba(23,61,72,.88);color:#fff;padding:2px 6px;border-radius:6px}
.hud{position:absolute;left:10px;top:10px;background:rgba(23,61,72,.82);color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;pointer-events:none;max-width:calc(100% - 20px)}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:8px 0 0 8px}.seg .btn:last-child{border-radius:0 8px 8px 0;border-left:none}
.fs{position:absolute;right:10px;top:10px;z-index:2;background:rgba(23,61,72,.82);color:#fff;border-color:transparent}
.fs[aria-pressed="true"]{background:rgba(23,61,72,.95);color:#fff}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;margin-top:8px;color:var(--fg)}
.keys span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.keys i{width:14px;height:10px;border-radius:2px;display:inline-block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#173d48;background:rgba(243,246,245,.7);font-size:15px;text-align:center;padding:16px}
body.expanded .vgrid{grid-template-columns:1fr}
body.expanded .panowrap{height:calc(100vh - 140px)}
body.expanded #planPanel{display:none}
@media (prefers-reduced-motion:reduce){.mk:hover{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<div class="page" id="listPage">
  <header style="display:grid;gap:10px">
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><h1 id="title"></h1><button class="btn" id="langL" type="button"></button></div>
    <p class="lede" id="lede"></p>
    <div class="legend"><span data-h="leg_plan"></span><span id="gtLegend" data-h="leg_gt"></span><span data-h="leg_dir"></span><span id="badLegend"></span></div>
  </header>
  <div class="bar">
    <div class="chips" role="group" data-aria="filter">
      <button class="chip" data-f="all" aria-pressed="true" data-t="f_all"></button>
      <button class="chip" data-f="conn" aria-pressed="false" data-t="f_conn"></button>
      <button class="chip" data-f="split" aria-pressed="false" data-t="f_split"></button>
      <button class="chip" data-f="gt" aria-pressed="false" data-t="f_gt"></button>
      <button class="chip" data-f="open" aria-pressed="false">one_open_space</button>
      <button class="chip" data-f="big" aria-pressed="false" data-t="f_big"></button>
      <button class="chip" data-f="dir" aria-pressed="false" data-t="f_dir"></button>
      <button class="chip" data-f="bad" aria-pressed="false" data-t="f_bad"></button>
    </div>
    <input id="q" type="search" data-ph="search" data-aria="search">
    <select id="sort" data-aria="sort"><option value="id" data-t="s_id"></option><option value="iou" data-t="s_iou"></option><option value="loop" data-t="s_loop"></option><option value="bad" data-t="s_bad"></option></select>
    <span class="count" id="count"></span>
  </div>
  <main class="list" id="list"></main>
</div>

<div id="viewer" hidden>
  <div class="vhead">
    <button class="btn" id="back" data-t="back"></button>
    <h2 id="vTitle"></h2>
    <span id="compBtns" class="chips"></span>
    <span class="seg" role="group" data-aria="plan_mode">
      <button class="btn" id="mEach" aria-pressed="true" data-t="m_each"></button>
      <button class="btn" id="mPlan" aria-pressed="false" data-t="m_plan"></button>
      <button class="btn" id="mCV" aria-pressed="false" data-t="m_cv"></button>
    </span>
    <button class="btn" id="tGT" aria-pressed="false" data-t="t_gt"></button>
    <button class="btn" id="langV" type="button"></button>
  </div>
  <div class="vgrid">
    <section class="panel" id="planPanel"><h3 data-t="plan_h"></h3><svg id="plan" role="img" data-aria="plan"></svg><div class="keys" id="keys"></div><p class="info" id="pInfo"></p></section>
    <section class="panel"><h3 id="pTitle"></h3>
      <div class="panowrap"><canvas id="pano" tabindex="0" data-aria="pano"></canvas><canvas id="overlay"></canvas><div id="markers"></div><div class="hud" id="hud"></div><button class="btn fs" id="expand" aria-pressed="false" data-title="expand_tip"></button><div class="loading" id="loading"></div></div>
      <p class="info" data-t="pano_help"></p>
    </section>
  </div>
</div>

<script>

const IMG_BASE = __IMG_BASE__;
const DATA = __DATA__;
const FLAGSTATS = __FLAGSTATS__;
const METHOD = __METHOD__;
const TITLE = __TITLE__, RUN = __RUN__;

const I18N={
 en:{lang_btn:'中文',lang_tip:'切換為中文',title:r=>r+' room group plans',
  lede:n=>n+' room groups. Camera poses come from CoVisPose (dual-pose agreement gate G, plus direction-only links whose rotation was validated on ZInD; '+(METHOD==='pose_graph'?'pose-graph optimisation of all accepted pairs, started from the spanning tree':'spanning tree, no global optimisation')+'); unit = camera height. Components with several panoramas use the union of the HorizonNet outlines; single-panorama components take, per column, the farther of CoVisPose and HorizonNet. Click a group to open the plan and panorama viewer.',

  plan_h:'平面圖（點相機可移動）',plan:'平面圖',pano_h:'實景',pano:'全景照片，可拖曳環顧',

let LANG=__LANG__;try{const v=localStorage.getItem('rcf_viewer_lang');if(v==='en'||v==='zh')LANG=v;}catch(e){}

const t=(k,...a)=>{const v=(I18N[LANG][k]!==undefined?I18N[LANG][k]:I18N.en[k]);return typeof v==='function'?v(...a):v;};

const $ = id => document.getElementById(id), PI = Math.PI;
const rot=(p,a)=>[p[0]*Math.cos(a)-p[1]*Math.sin(a),p[0]*Math.sin(a)+p[1]*Math.cos(a)],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];

let filter='all';
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e;};
function card(d){
  const b=el('button','card');b.type='button';b.onclick=()=>openGroup(d.id);
  const h=el('div','head');h.append(el('span','gid',d.id),el('span','tag',d.kind),el('span','tag',t('n_img',d.n)));
  const conn=d.comps.length===1;h.append(el('span','tag '+(conn?'ok':'warn'),conn?t('f_conn'):t('comps')+' '+d.comps.map(c=>c.panos.length).join(' + ')));

  const th=el('div','thumb');const im=new Image();im.alt=d.id;im.loading='lazy';im.src=d.thumb;th.append(im);

let cards=new Map(DATA.map(d=>[d.id,card(d)]));
function renderList(){
  const q=$('q').value.trim().toLowerCase(),sort=$('sort').value;
  let rows=DATA.filter(d=>filter==='all'||(filter==='conn'&&d.comps.length===1)||(filter==='split'&&d.comps.length>1)||(filter==='gt'&&d.iou!=null)
    ||(filter==='open'&&d.kind==='one_open_space')||(filter==='big'&&d.n>=3)||(filter==='dir'&&d.dirlink)||(filter==='bad'&&d.nbad>0));
  if(q)rows=rows.filter(d=>d.id.toLowerCase().includes(q)||d.labels.join(' ').toLowerCase().includes(q));
  if(sort==='iou')rows=rows.slice().sort((a,b)=>(a.iou??9)-(b.iou??9));
  if(sort==='bad')rows=rows.slice().sort((a,b)=>(b.nbad||0)-(a.nbad||0));
  if(sort==='loop')rows=rows.slice().sort((a,b)=>(b.loop??-1)-(a.loop??-1));
  $('list').replaceChildren(...rows.map(d=>cards.get(d.id)));
  $('count').textContent=t('count',rows.length,DATA.length);
  document.querySelectorAll('.chip[data-f]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.f===filter)));
}
document.querySelectorAll('.chip[data-f]').forEach(c=>c.onclick=()=>{filter=c.dataset.f;renderList();});
$('q').oninput=renderList;$('sort').onchange=renderList;

/* ---------------- viewer state ---------------- */

const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;};

function rayHit(poly,lon){const d=dirOf(lon);let best=Infinity;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],e=sub(q,p),den=d[0]*e[1]-d[1]*e[0];if(Math.abs(den)<1e-12)continue;const r=(p[0]*e[1]-p[1]*e[0])/den,s=(p[0]*d[1]-p[1]*d[0])/den;if(r>0&&s>=0&&s<=1&&r<best)best=r;}return best;}
function drawFloor(ctx,cur,world,color,w,h,dash){if(!world||world.length<2)return;ctx.strokeStyle=color;ctx.setLineDash(dash?[8,6]:[]);ctx.beginPath();let pen=false;

function renderPano(){const [w,h]=size(cv);size($('overlay'));
 if(gl&&texId){gl.viewport(0,0,w,h);gl.uniform1f(gl.getUniformLocation(prog,'h'),S.h);gl.uniform1f(gl.getUniformLocation(prog,'pt'),S.p);gl.uniform1f(gl.getUniformLocation(prog,'tf'),Math.tan(S.fov/2));gl.uniform1f(gl.getUniformLocation(prog,'asp'),w/h);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

 const cur=cam(S.cam);
 if(S.mode==='each'){for(const id of C().panos){const o=cam(id);if(!o.outline)continue;ctx.lineWidth=(id===S.cam?3:2)*dpr;
   drawFloor(ctx,cur,o.outline.map(p=>toWorld(o,p)),rgba(colorOf(id),id===S.cam?.95:.85),w,h,id!==S.cam);}ctx.lineWidth=2.5*dpr;}
 else{const pc=css(S.mode==='cv'?'--cv':'--plan');for(const ring of (S.mode==='cv'?C().cvplan:C().plan))drawFloor(ctx,cur,ring,pc.startsWith('#')?rgba(pc,.95):pc,w,h,false);}
 if(S.gt&&C().gt)for(const ring of C().gt)drawFloor(ctx,cur,ring,'rgba(255,215,0,.9)',w,h,true);
 for(const id of C().panos){if(id===S.cam)continue;const o=cam(id),lp=toLocal(cur,o.t),d=Math.hypot(...lp),lon=lonOf(lp),pr=project(lon,-Math.atan2(1,d),w,h);
  if(!pr||pr[0]<0||pr[0]>w||pr[1]<0||pr[1]>h)continue;const behind=cur.outline?rayHit(cur.outline,lonOf(rot(sub(o.t,cur.t),-cur.yaw)))<d-0.15:false;
  const b=document.createElement('button');b.className='mk'+(o.unc?' unc':'')+(o.bad?' bad':'')+(behind?' wall':'');b.style.left=(pr[0]/dpr)+'px';b.style.top=(pr[1]/dpr)+'px';
  b.innerHTML=`${id.slice(9,13)}<small>${t('walk')} ${o.label}${o.unc?' *':''}${o.bad?' !':''} · ${d.toFixed(1)}</small>`;b.onclick=()=>setCam(id,true);box.appendChild(b);}
}
const NS='http://www.w3.org/2000/svg';function sv(t,a={},txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;return e;}

 const c=C(),cams=c.panos.map(cam),pts=[...(S.mode==='cv'?c.cvplan:c.plan).flat(),...cams.map(o=>o.t),...(S.gt&&c.gt?c.gt.flat():[]),[0.6,0.6],[-0.6,-0.6]];
 const xs=pts.map(p=>-p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),sc=Math.min((W-50)/((x1-x0)||1),(H-50)/((y1-y0)||1)),cx=(x0+x1)/2,cy=(y0+y1)/2;

 if(S.gt&&c.gt)for(const ring of c.gt)svg.appendChild(sv('polygon',{points:P(ring),fill:css('--gt'),stroke:'none'}));

  for(const id of c.panos){const o=cam(id);if(o.outline)svg.appendChild(sv('polygon',{points:P(o.outline.map(p=>toWorld(o,p))),fill:colorOf(id),'fill-opacity':.10,stroke:colorOf(id),'stroke-width':id===S.cam?3:2}));}
  const defs=sv('defs'),pat=sv('pattern',{id:'hatch',width:7,height:7,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'});pat.appendChild(sv('line',{x1:0,y1:0,x2:0,y2:7,stroke:css('--fg'),'stroke-width':1.6,'stroke-opacity':.45}));defs.appendChild(pat);svg.appendChild(defs);

  for(const ring of (cvm?c.cvplan:c.plan))svg.appendChild(sv('polygon',{points:P(ring),fill:pc,'fill-opacity':.14,stroke:pc,'stroke-width':2.5}));
  for(const o of cams){const ol=cvm?o.cvo:o.outline;if(ol)svg.appendChild(sv('polygon',{points:P(ol.map(p=>toWorld(o,p))),fill:'none',stroke:css('--muted'),'stroke-width':.8,'stroke-opacity':.6}));}

function renderKeys(){const k=$('keys');k.replaceChildren();if(S.mode==='plan'){k.append(el('span',null,t('keys_plan')));return;}
 if(S.mode==='cv'){k.append(el('span',null,t('keys_cv')));return;}
 for(const id of C().panos){const o=cam(id),s=el('span');const i=el('i');i.style.background=colorOf(id);s.append(i,(o.label||id.slice(9,13))+(o.src==='MX'?t('mx'):'')+(o.unc?' *':'')+(o.bad?' !':''));s.onclick=()=>setCam(id,false);k.append(s);}
 if((C().overlap||[]).length){const s=el('span');const i=el('i');i.style.background='repeating-linear-gradient(45deg,'+css('--fg')+' 0 2px,transparent 2px 5px)';s.append(i,t('overlap'));k.append(s);}}
function render(){renderPano();renderPlan();renderKeys();const deg=((S.h*180/PI)%360+360)%360;$('hud').textContent=t('hud',cam(S.cam).label,deg.toFixed(0));}
function camTitle(){const n=cam(S.cam);$('pTitle').textContent=t('pano_h')+' · '+n.label+(n.unc?t('pos_unc'):'')+(n.bad?t('pose_bad'):'');}
function setCam(id,keepWorld){const prev=S.cam?cam(S.cam):null,n=cam(id);
 if(keepWorld&&prev){const v=rot(dirOf(S.h),prev.yaw);S.h=lonOf(rot(v,-n.yaw));}
 S.cam=id;camTitle();$('loading').hidden=false;$('loading').textContent=t('loading');
 photo(id,img=>{if(S.cam!==id)return;if(gl){setTexture(img);texId=id;}$('loading').hidden=true;render();});render();}
const pct=x=>Math.round(x*100)+'%';
function badWhy(b){const r=[];for(const w of b.weak){const q=[];if(w.frac<.5)q.push(t('frac',w.frac.toFixed(2)));if(w.dyaw>2.5)q.push(t('dyaw',w.dyaw.toFixed(1)));if(w.dt>.125)q.push(t('dt',w.dt.toFixed(2)));r.push(t('weak',q.join(t('sep'))));}
 if(b.loop)r.push(t('loopbad',b.loop.yaw.toFixed(1),b.loop.t.toFixed(2)));return r.join(t('sep2'));}
function badText(c){const L=c.panos.filter(id=>cam(id).bad);if(!L.length)return '';

  +(FLAGSTATS?'<br>'+t('flagstats',pct(FLAGSTATS.W.flagged),pct(FLAGSTATS.L.flagged),pct(FLAGSTATS.L.unflagged),pct(FLAGSTATS.W.unflagged)):'');}
function fillInfo(){const c=C(),unc=c.panos.filter(id=>cam(id).unc).map(id=>cam(id).label);
 $('pInfo').innerHTML=`${c.method} · ${t('n_panos',c.panos.length)}${G().iou!=null?' · '+t('g_iou')+' '+G().iou.toFixed(3):''}${G().loop!=null?' · '+t('loop_max')+' '+G().loop.toFixed(1)+'°':''}`
  +(unc.length?`<br><span class="warn">${t('dir_linked',unc.join(t('sep')))}</span>`:'')
  +badText(c)
  +(G().comps.length>1?`<br><span class="warn">${t('split',G().comps.length)}</span>`:'');}
function compBtns(){const g=G(),cb=$('compBtns');cb.replaceChildren();if(g.comps.length>1)g.comps.forEach((c,i)=>{const b=el('button','btn',t('comp_btn',i+1,c.panos.length));b.setAttribute('aria-pressed',String(i===S.comp));b.onclick=()=>setComp(i);cb.append(b);});}
function setComp(i){S.comp=i;const c=C();document.querySelectorAll('#compBtns .btn').forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));
 $('tGT').disabled=!c.gt;if(!c.gt){S.gt=false;$('tGT').setAttribute('aria-pressed','false');}
 fillInfo();
 S.cam=null;S.h=0;S.p=-0.05;setCam(c.root,false);}
function openGroup(id){const g=DATA.find(d=>d.id===id);if(!g)return;S.g=g;$('vTitle').textContent=g.id+' · '+g.kind;
 S.comp=0;compBtns();

const tog=(id,k)=>{$(id).onclick=()=>{S[k]=!S[k];$(id).setAttribute('aria-pressed',String(S[k]));render();};};tog('tGT','gt');
const setMode=m=>{S.mode=m;$('mEach').setAttribute('aria-pressed',String(m==='each'));$('mPlan').setAttribute('aria-pressed',String(m==='plan'));$('mCV').setAttribute('aria-pressed',String(m==='cv'));render();};
