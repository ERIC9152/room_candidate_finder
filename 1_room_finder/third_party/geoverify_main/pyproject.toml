[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roma-geo"
version = "2.0.0"
description = "Panorama pair geometry verification"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
roma-geo = "roma_geo.__main__:main"

[tool.setuptools]
packages = ["roma_geo", "pose_regions", "roma_match", "core_roma_match", "semantic_doors"]

[tool.setuptools.package-dir]
roma_geo = "src/roma_geo"
pose_regions = "pose_regions"
roma_match = "roma_match"
core_roma_match = "core_roma_match"
semantic_doors = "semantic_doors"
